<rect width="1600" height="900" fill="#fcfcfb"/>
<text x="60" y="70.0" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="start">From usage to campus-tuned models: the research flywheel</text>
<text x="60" y="108.0" font-size="20" fill="#52514e" font-weight="400" text-anchor="start">Every stage is useful on its own; consent and governance come first</text>
