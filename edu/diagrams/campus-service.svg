<text x="1405.0" y="276.6" font-size="14" fill="#2e2d2a" font-weight="400" text-anchor="middle">model cache (weights)</text>
<text x="1405.0" y="294.8" font-size="14" fill="#2e2d2a" font-weight="400" text-anchor="middle">compile cache</text>
