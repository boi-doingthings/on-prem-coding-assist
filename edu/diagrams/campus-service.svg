<text x="1405.0" y="531.6" font-size="14" fill="#6b2a0e" font-weight="400" text-anchor="middle">consented traces → eval sets</text>
<text x="1405.0" y="549.8" font-size="14" fill="#6b2a0e" font-weight="400" text-anchor="middle">→ LoRA / SFT with NeMo</text>
<text x="1405.0" y="568.0" font-size="14" fill="#6b2a0e" font-weight="400" text-anchor="middle">→ served as adapters</text>
