<text x="1142.0" y="506.0" font-size="12" fill="#ffffff" font-weight="400" text-anchor="middle">replica</text>
<text x="980" y="560.0" font-size="15" fill="#233a00" font-weight="600" text-anchor="middle">A100 → B300: same launcher, model profile per tier</text>
<text x="980" y="590.0" font-size="15" fill="#233a00" font-weight="600" text-anchor="middle">watchdog: real 1-token probe → requeue</text>
