<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Campus AI service on idle GPUs">
<defs><marker id="mdefault" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker><marker id="mdefaults" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker><marker id="mkv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><marker id="mkvs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><marker id="mdynamo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f9400"/></marker><marker id="mdynamos" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f9400"/></marker><marker id="mclient" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="mclients" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker></defs>
<rect width="1600" height="900" fill="#fcfcfb"/>
<text x="60" y="70.0" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="start">Campus AI service on idle GPUs</text>
<text x="60" y="108.0" font-size="20" fill="#52514e" font-weight="400" text-anchor="start">Research jobs keep priority; the service harvests idle cycles and restarts in minutes from a shared model cache</text>
<rect x="60" y="170" width="280" height="480" rx="10" fill="#e8f1fc" stroke="#2a78d6" stroke-width="2"/>
<text x="200" y="205.0" font-size="22" fill="#0d366b" font-weight="700" text-anchor="middle">Users</text>
<rect x="80" y="230" width="240" height="115" rx="10" fill="#fcfcfb" stroke="#c9c8c2" stroke-width="2"/>
<text x="200.0" y="269.3" font-size="17" fill="#52514e" font-weight="700" text-anchor="middle">Students</text>
<text x="200.0" y="293.2" font-size="14" fill="#52514e" font-weight="400" text-anchor="middle">coding agents in</text>
<text x="200.0" y="311.4" font-size="14" fill="#52514e" font-weight="400" text-anchor="middle">terminal &amp; IDE</text>
<rect x="80" y="365" width="240" height="115" rx="10" fill="#fcfcfb" stroke="#c9c8c2" stroke-width="2"/>
<text x="200.0" y="404.3" font-size="17" fill="#52514e" font-weight="700" text-anchor="middle">Faculty &amp; staff</text>
<text x="200.0" y="428.2" font-size="14" fill="#52514e" font-weight="400" text-anchor="middle">Open WebUI chat</text>
<text x="200.0" y="446.4" font-size="14" fill="#52514e" font-weight="400" text-anchor="middle">course tools</text>
<rect x="80" y="500" width="240" height="115" rx="10" fill="#fcfcfb" stroke="#c9c8c2" stroke-width="2"/>
<text x="200.0" y="539.3" font-size="17" fill="#52514e" font-weight="700" text-anchor="middle">Researchers</text>
<text x="200.0" y="563.2" font-size="14" fill="#52514e" font-weight="400" text-anchor="middle">evals · batch jobs</text>
<text x="200.0" y="581.4" font-size="14" fill="#52514e" font-weight="400" text-anchor="middle">trace studies</text>
<rect x="390" y="170" width="300" height="480" rx="10" fill="#f0efec" stroke="#8a8984" stroke-width="2"/>
<text x="540" y="205.0" font-size="20" fill="#2e2d2a" font-weight="700" text-anchor="middle">Gateway (CPU VM)</text>
