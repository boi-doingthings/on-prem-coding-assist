<text x="540.0" y="295.0" font-size="14" fill="#2e2d2a" font-weight="400" text-anchor="middle">LiteLLM virtual keys</text>
<text x="540.0" y="313.2" font-size="14" fill="#2e2d2a" font-weight="400" text-anchor="middle">Open WebUI (OIDC)</text>
<rect x="410" y="365" width="260" height="120" rx="10" fill="#f0efec" stroke="#8a8984" stroke-width="2"/>
<text x="540.0" y="399.4" font-size="16" fill="#2e2d2a" font-weight="700" text-anchor="middle">Fairness</text>
<text x="540.0" y="421.8" font-size="13" fill="#2e2d2a" font-weight="400" text-anchor="middle">rpm/tpm per key</text>
<text x="540.0" y="438.6" font-size="13" fill="#2e2d2a" font-weight="400" text-anchor="middle">concurrency cap below</text>
<text x="540.0" y="455.6" font-size="13" fill="#2e2d2a" font-weight="400" text-anchor="middle">the measured cliff</text>
<rect x="410" y="500" width="260" height="130" rx="10" fill="#f0efec" stroke="#8a8984" stroke-width="2"/>
<text x="540.0" y="539.4" font-size="16" fill="#2e2d2a" font-weight="700" text-anchor="middle">Usage &amp; governance</text>
<text x="540.0" y="561.7" font-size="13" fill="#2e2d2a" font-weight="400" text-anchor="middle">usage metadata by default</text>
<text x="540.0" y="578.6" font-size="13" fill="#2e2d2a" font-weight="400" text-anchor="middle">prompt text only with</text>
<text x="540.0" y="595.5" font-size="13" fill="#2e2d2a" font-weight="400" text-anchor="middle">opt-in consent</text>
