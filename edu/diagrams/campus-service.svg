<text x="80" y="740.0" font-size="19" fill="#0b0b0b" font-weight="700" text-anchor="start">Serving patterns</text>
<text x="80" y="785.0" font-size="17" fill="#233a00" font-weight="700" text-anchor="start">Preemptible QOS</text>
<text x="80" y="812.0" font-size="15" fill="#52514e" font-weight="400" text-anchor="start">research jobs preempt; Slurm requeues</text>
<text x="450" y="785.0" font-size="17" fill="#233a00" font-weight="700" text-anchor="start">Serving windows</text>
<text x="450" y="812.0" font-size="15" fill="#52514e" font-weight="400" text-anchor="start">nights · weekends · term breaks</text>
<text x="820" y="785.0" font-size="17" fill="#233a00" font-weight="700" text-anchor="start">Reserved slice</text>
<text x="820" y="812.0" font-size="15" fill="#52514e" font-weight="400" text-anchor="start">one node for the service</text>
<text x="1190" y="785.0" font-size="17" fill="#233a00" font-weight="700" text-anchor="start">Burst replicas</text>
<text x="1190" y="812.0" font-size="15" fill="#52514e" font-weight="400" text-anchor="start">extra jobs join the same frontend</text>
