<text x="1034.0" y="506.0" font-size="12" fill="#ffffff" font-weight="400" text-anchor="middle">replica</text>
<rect x="1094" y="370" width="96" height="70" rx="6" fill="#1f1f1d" stroke="#1f1f1d" stroke-width="2"/>
