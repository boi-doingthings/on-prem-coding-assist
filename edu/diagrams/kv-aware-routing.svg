<text x="880" y="692.0" font-size="20" fill="#52514e" font-weight="700" text-anchor="start">cost 4.8</text>
<rect x="1040" y="330" width="500" height="420" rx="10" fill="#eef7df" stroke="#5f9400" stroke-width="2"/>
<text x="1290" y="375.0" font-size="24" fill="#233a00" font-weight="700" text-anchor="middle">Router decision</text>
<text x="1290" y="425.0" font-size="18" fill="#233a00" font-weight="600" text-anchor="middle">cost = prefill of uncached blocks</text>
<text x="1290" y="453.0" font-size="18" fill="#233a00" font-weight="600" text-anchor="middle">+ weight × current load</text>
<text x="1290" y="515.0" font-size="20" fill="#0b0b0b" font-weight="700" text-anchor="middle">Pick Worker 1: only block D to prefill</text>
<text x="1290" y="575.0" font-size="17" fill="#e34948" font-weight="600" text-anchor="middle">Round-robin picks whoever is next:</text>
<text x="1290" y="600.0" font-size="17" fill="#e34948" font-weight="600" text-anchor="middle">2 times in 3 it recomputes ~40–50K tokens</text>
<text x="1290" y="650.0" font-size="16" fill="#52514e" font-weight="400" text-anchor="middle">Index kept current by KV events</text>
<text x="1290" y="675.0" font-size="16" fill="#52514e" font-weight="400" text-anchor="middle">(block stored / evicted) from every worker</text>
<path d="M960.0,392.0 L1040.0,392.0" fill="none" stroke="#5f9400" stroke-width="3" marker-end="url(#mdynamo)"/>
<text x="60" y="830.0" font-size="17" fill="#52514e" font-weight="400" text-anchor="start" font-style="italic">Measured on 8 × B300, multi-turn agent sessions (same GPUs, same model, only the router changed):</text>
<text x="60" y="860.0" font-size="19" fill="#233a00" font-weight="700" text-anchor="start">prefix-cache hits 70% vs 34% · first token 1.7–1.8× faster · +35–51% output tokens/s per GPU.</text>
